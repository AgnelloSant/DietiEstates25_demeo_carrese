server.port=8081
spring.application.name=user-service


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Mail sender
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==== JWT (configurazione) ====
jwt.private-pem=${JWT_PRIVATE_PEM_B64:file:.config/private.pem.b64}
jwt.public-pem=${JWT_PUBLIC_PEM_B64:file:.config/public.pem.b64}


jwt.iss=${JWT_ISS:ingsw-auth}
jwt.aud=${JWT_AUD:ingsw-apis}
jwt.access-ttl=${JWT_ACCESS_TTL:15m}
jwt.refresh-ttl=${JWT_REFRESH_TTL:30d}
jwt.kid=${JWT_KID:current-001}

# Cookie del refresh
jwt.refresh-cookie-name=${REFRESH_COOKIE_NAME:refreshToken}
jwt.refresh-cookie-path=${REFRESH_COOKIE_PATH:/api/v1/user/refresh}
jwt.refresh-cookie-same-site=${REFRESH_COOKIE_SAMESITE:Strict}
jwt.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
jwt.jwks-max-age-seconds=${JWKS_CACHE_MAXAGE_SECONDS:300}

# ==== DB (sposta credenziali su ENV/Secret) ====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ==== Mail (sposta credenziali su ENV/Secret) ====
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}

# (Se stai dietro proxy/ingress e vuoi cookie Secure corretti)
server.forward-headers-strategy=framework


# ========== OAUTH2 - GOOGLE ==========
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=email,profile

# Forza prompt scelta account
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

# ========== OAUTH2 - FACEBOOK ==========
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.redirect-uri=https://${NGROK_DOMAIN}/login/oauth2/code/facebook
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# Provider Facebook
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v18.0/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# ========== OAUTH2 - GITHUB ==========
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# Provider GitHub
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id
