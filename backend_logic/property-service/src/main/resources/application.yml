server:
  port:8082

spring:
  application:
    name: property-service
  
  datasource:
    url: jdbc:h2:mem:propertydb
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

h2:
  console:
    enabled: true