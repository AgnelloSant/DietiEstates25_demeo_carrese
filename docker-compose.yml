services:
  eureka-server:
    build: ./backend_logic/eureka-server
    environment:
      # Porta del server Eureka
      SERVER_PORT: 8761
    ports:
      - "8761:8761"

  user-service:
    build: ./backend_logic/user-service
    environment:
      # Forza la porta del servizio
      SERVER_PORT: 8081
      # Registrazione su Eureka (DNS interno: eureka-server)
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"

      # DB esterno (valori presi dal file .env accanto a questo compose)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      - eureka-server
    ports:
      - "8081:8081"

  property-service:
    build: ./backend_logic/property-service
    environment:
      SERVER_PORT: 8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"

      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      - eureka-server
    ports:
      - "8082:8082"
