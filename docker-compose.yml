services:
  user-service:
    build: ./backend/user-service
    container_name: user-service
    ports:
      - "8080:8080"
    env_file:
      - ./backend/user-service/.env
    networks:
      - dieti-network

  property-service:
    build: ./backend/property-service
    container_name: property-service
    ports:
      - "8081:8081"
    env_file:
      - ./backend/property-service/.env
    networks:
      - dieti-network
    volumes:
      - ./uploads:/app/uploads

  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8082:8082"
    env_file:
      - ./backend/api-gateway/.env
    depends_on:
      - user-service
      - property-service
    networks:
      - dieti-network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8082
      - VITE_API_USER_URL=/user
      - VITE_API_PROPERTY_URL=/properties
    depends_on:
      - api-gateway
    networks:
      - dieti-network

networks:
  dieti-network:
    driver: bridge
