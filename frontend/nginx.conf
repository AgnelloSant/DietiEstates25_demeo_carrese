server {
    listen 80;
    server_name localhost;
    
    # Root unica e assoluta
    root /usr/share/nginx/html;
    index index.html;

    # Supporto per file statici e Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gli assets ora verranno cercati in /usr/share/nginx/html/assets/
    location /assets/ {
        try_files $uri =404;
    }

    # Proxy API Gateway
    location /property/ {
        resolver 169.254.169.253 valid=30s;
        proxy_pass http://api-gateway.dietiestates.local:8082;
        proxy_set_header Host $host;
    }

    location /user/ {
        resolver 169.254.169.253 valid=30s;
        proxy_pass http://user-service.dietiestates.local:8080;
        proxy_set_header Host $host;
    }
}