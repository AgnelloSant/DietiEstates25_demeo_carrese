server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # GESTIONE FRONTEND
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # GESTIONE API (Proprietà e altro tramite Gateway)
    # Se il frontend chiama /property/... lo mandiamo al Gateway
    location /property/ {
        resolver 169.254.169.253 valid=30s;
        set $backend_gateway "api-gateway.dietiestates.local";
        proxy_pass http://$backend_gateway:8082;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GESTIONE USER (Login/Register via User-Service o Gateway)
    location /user/ {
        resolver 169.254.169.253 valid=30s;
        # Se vuoi andare diretto allo user service, usa la sua porta (es. 8080)
        # Se vuoi passare dal gateway, usa 8082
        set $user_target "user-service.dietiestates.local"; 
        proxy_pass http://$user_target:8080; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Per sicurezza aggiungiamo anche /api/ se usato
    location /api/ {
        resolver 169.254.169.253 valid=30s;
        set $backend_gateway "api-gateway.dietiestates.local";
        proxy_pass http://$backend_gateway:8082;
    }
}
