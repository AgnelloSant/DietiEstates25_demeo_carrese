server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve uploaded files directly
    location /uploads/ {
        alias /app/uploads/;
        autoindex off;
    }

    # Proxy to API Gateway (port 8082)
    # Routes requests starting with /api/ or specific service prefixes to the gateway
    location /user/ {
        proxy_pass ${API_GATEWAY_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /properties/ {
        proxy_pass ${API_GATEWAY_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass ${API_GATEWAY_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
