server {
    listen 80;
    server_name localhost;

    # Definiamo la root una volta sola per tutto il server
    root /usr/share/nginx/html;
    index index.html;

    # Gestione delle rotte Frontend (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # GESTIONE ASSETS - Semplificata al massimo
    # Nginx cercherà i file in root + /assets/ -> /usr/share/nginx/html/assets/
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        # Non serve 'root' o 'alias' qui se è già definito sopra
    }

    # Proxy per le API (Lasciali come sono, vanno bene)
    location /property/ {
        resolver 169.254.169.253 valid=30s;
        set $backend_gateway "api-gateway.dietiestates.local";
        proxy_pass http://$backend_gateway:8082;
        proxy_set_header Host $host;
    }

    location /user/ {
        resolver 169.254.169.253 valid=30s;
        set $user_service "user-service.dietiestates.local";
        proxy_pass http://$user_service:8080;
        proxy_set_header Host $host;
    }
}