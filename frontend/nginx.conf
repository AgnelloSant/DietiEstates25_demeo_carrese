server {
    listen 80;
    server_name localhost;

    # Percorso assoluto dove COPY ha messo i file di /dist
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Importante: cerca il file, se non lo trova rimanda a index.html (per Vue Router)
        try_files $uri $uri/ /index.html;
    }

    # Gestione esplicita degli asset (js, css, immagini)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy per le chiamate API che il tuo frontend invia a /property
    location /property/ {
        resolver 169.254.169.253 valid=30s;
        set $backend_gateway "api-gateway.dietiestates.local";
        proxy_pass http://$backend_gateway:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy per le chiamate API che il tuo frontend invia a /user
    location /user/ {
        resolver 169.254.169.253 valid=30s;
        set $user_service "user-service.dietiestates.local";
        proxy_pass http://$user_service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}