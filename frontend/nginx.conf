server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

    location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 169.254.169.253 valid=30s;

        set $backend_gateway "api-gateway.dietiestates.local";

        proxy_pass http://$backend_gateway:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /user/ {
        resolver 169.254.169.253 valid=30s;

        set $user_service_host "user-service.dietiestates.local";

        proxy_pass http://$user_service_host:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}
