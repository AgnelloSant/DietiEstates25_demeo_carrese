<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sfondo gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)"/>
  
  <!-- Casa stilizzata -->
  <g transform="translate(50, 50)">
    <!-- Tetto -->
    <path d="M -22 -8 L 0 -25 L 22 -8 Z" fill="#fff"/>
    
    <!-- Casa base -->
    <rect x="-18" y="-8" width="36" height="28" fill="#fff" rx="2"/>
    
    <!-- Porta -->
    <rect x="-6" y="8" width="12" height="12" fill="url(#bgGradient)" rx="1"/>
    
    <!-- Finestra sinistra -->
    <rect x="-14" y="-2" width="8" height="8" fill="#ffd89b" rx="1"/>
    
    <!-- Finestra destra -->
    <rect x="6" y="-2" width="8" height="8" fill="#ffd89b" rx="1"/>
  </g>
</svg>
