server.port=8082
spring.application.name=api-gateway

# JWT Configuration
jwt.public.key=${JWT_PUBLIC_KEY}

# Eureka Configuration (Optional placeholder)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Routes Configuration

spring.cloud.gateway.routes[0].id=property-service
spring.cloud.gateway.routes[0].uri=${PROPERTY_SERVICE_URL:http://property-service:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/properties/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=${USER_SERVICE_URL:http://user-service:8080}
spring.cloud.gateway.routes[1].predicates[0]=Path=/user/**
