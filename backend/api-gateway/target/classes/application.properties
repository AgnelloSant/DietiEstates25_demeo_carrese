server.port=8082
spring.application.name=api-gateway

# JWT Configuration
jwt.public.key=${JWT_PUBLIC_KEY}

# Eureka Configuration (Optional placeholder)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Routes Configuration
spring.cloud.gateway.routes[0].id=property-service
spring.cloud.gateway.routes[0].uri=http://property-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/properties/**
# If the service already listens on /properties, we DON'T need StripPrefix.
# If we used StripPrefix=1, /properties/foo would become /foo.
# Since context-path is /properties, we want /properties/foo -> /properties/foo.

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=http://user-service:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/user/**
# Assuming user-service might also have context-path /user or simply endpoints starting with /user.
# If user-service does NOT have context-path=/user, but endpoints like /auth/login, we might need a rewrite.
# But conventionally, keeping the prefix is safer if services are namespaced.
