version: '3'
services:
  #--- Backend Services ---#
  user-service:
    image: ${ACR_LOGIN_SERVER}/user-service:latest
    container_name: user-service
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Database connection (Override in Azure App Settings)
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}

  property-service:
    image: ${ACR_LOGIN_SERVER}/property-service:latest
    container_name: property-service
    expose:
      - "8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - ${WEBAPP_STORAGE_HOME}/site/wwwroot/uploads:/app/uploads

  api-gateway:
    image: ${ACR_LOGIN_SERVER}/api-gateway:latest
    container_name: api-gateway
    expose:
      - "8082"
    depends_on:
      - user-service
      - property-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # JWT Secret (Override in Azure App Settings)
      - JWT_SECRET=${JWT_SECRET}

  #--- Frontend Service ---#
  frontend:
    image: ${ACR_LOGIN_SERVER}/frontend:latest
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    volumes:
      - ${WEBAPP_STORAGE_HOME}/site/wwwroot/uploads:/app/uploads
