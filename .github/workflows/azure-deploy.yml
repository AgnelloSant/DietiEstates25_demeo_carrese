name: Build and Push to ACR

on:
  push:
    branches: [ "mainUpdate" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build Backend with Maven
      run: mvn clean package -DskipTests
      working-directory: backend

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push API Gateway
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/api-gateway:${{ github.sha }} -t ${{ secrets.ACR_LOGIN_SERVER }}/api-gateway:latest backend/api-gateway
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/api-gateway --all-tags

    - name: Build and Push User Service
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/user-service:${{ github.sha }} -t ${{ secrets.ACR_LOGIN_SERVER }}/user-service:latest backend/user-service
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/user-service --all-tags

    - name: Build and Push Property Service
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/property-service:${{ github.sha }} -t ${{ secrets.ACR_LOGIN_SERVER }}/property-service:latest backend/property-service
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/property-service --all-tags

    - name: Build and Push Frontend
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest frontend
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend --all-tags
